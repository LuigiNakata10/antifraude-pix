# O docker compose sobe a aplicacao e o banco juntos, com um comando so:
#
#     docker compose up
#
# Os testes rodam dentro do compose, sem Python na sua maquina:
#
#     docker compose --profile test run --build --rm tests
#
# Para rodar o pytest do HOST (pip install -r requirements-dev.txt e pytest),
# publique o banco e o mock com o docker-compose.host-ports.yml.
#
# Nao precisa criar arquivo nenhum antes: cada configuracao abaixo tem um
# valor padrao, escrito no proprio ${VARIAVEL:-padrao}. Le-se assim:
# "use o que estiver na variavel VARIAVEL; se ela nao existir, use padrao".
#
# O .env continua valendo, e agora e OPCIONAL: se voce criar um (copiando
# o .env.example), o compose le esse arquivo e o que estiver la ganha do
# padrao. E o jeito de trocar uma porta ocupada ou o token, sem editar
# este arquivo.

services:
  api:
    build:
      context: .
      target: api
    ports:
      # Se a porta 3000 ja estiver ocupada na sua maquina, coloque
      # API_PORT=3001 (ou outra livre) no seu .env.
      - "${API_PORT:-3000}:3000"
    environment:
      # Dentro do compose, o banco atende pelo nome "db" — nao por localhost.
      # Por isso esta linha nao tem padrao pra sobrescrever: aqui dentro o
      # endereco do banco e sempre este.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-antifraude-pix-api}
      # A senha que protege os endpoints internos. O padrao vale pra
      # estudar; num sistema de verdade, isso nunca teria valor padrao.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # O DICT, que o connector consulta (assunto da etapa do mock). Variavel
      # que nao esta nesta lista NAO CHEGA no container: o compose repassa
      # o que esta escrito aqui, e mais nada.
      DICT_API_URL: ${DICT_API_URL:-http://mockserver:1080}
      DICT_API_INTERNAL_TOKEN: ${DICT_API_INTERNAL_TOKEN:-default_token}
      DICT_API_TIMEOUT: ${DICT_API_TIMEOUT:-0.2}
      # O ISPB do banco que roda este motor. O payload so informa o ISPB do
      # DESTINO; a conta pagadora e sempre desta instituicao. Valor ficticio.
      INSTITUTION_ISPB: ${INSTITUTION_ISPB:-99999999}
    volumes:
      # Monta o codigo pra dentro do container: salvou o arquivo,
      # a API recarrega sozinha (o --reload ali embaixo).
      - ./src:/app
    # --reload: salvou o arquivo, a API reinicia sozinha.
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # "Subiu" nao e a mesma coisa que "ja responde". E esta checagem
      # que diz quando a API passa a atender de verdade — espere ela
      # ficar (healthy) antes de rodar o pytest, ou o primeiro teste
      # bate numa porta que ainda nao responde.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mockserver:
        condition: service_started

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    # Sem "ports": o banco so e acessado de dentro da rede do compose (a API e os
    # testes enxergam "db:5432"). Publicar a 5432 no host fazia o "docker compose
    # up" inteiro falhar em quem ja tem outro Postgres. Para acessa-lo do host,
    # use o docker-compose.host-ports.yml.
    healthcheck:
      # A API so sobe depois que o banco responder de verdade.
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  mockserver:
    # O DICT simulado (em producao, a QI consulta o DICT de verdade). Sobe com
    # as respostas de mocks/dict_expectations.json: por padrao, nenhuma conta
    # tem marcacao. Os testes roteirizam as respostas pela API REST dele.
    image: mockserver/mockserver:5.15.0
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/dict_expectations.json
    volumes:
      - ./mocks:/config:ro
    # Sem "ports", pelo mesmo motivo do banco: veja docker-compose.host-ports.yml.

  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      APP_ENV: test
      SERVER_LOCALHOST: api
      API_PORT: 3000
      MOCKSERVER_URL: http://mockserver:1080
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      INSTITUTION_ISPB: ${INSTITUTION_ISPB:-99999999}
    depends_on:
      api:
        condition: service_healthy
